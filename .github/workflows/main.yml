name: Eudora CI

on:
  # Every branch, not just main. Feature work is exactly where a broken
  # build is cheap to fix; catching it only once it reaches main means the
  # branch it came from has already moved on.
  push:
  pull_request:

jobs:
  # Things defined once and copied into client/ and mobile/, which are
  # independent pnpm projects with no import path between them. Every copy here
  # has drifted at least once, silently, because nothing type-checks a copy
  # against its source:
  #
  #   - Clio's phrase catalog, authored in voice/clio-phrases.json. The two
  #     hand-maintained copies it replaced had already diverged on a key name.
  #   - ModuleItemKind, authored in schema.prisma. Mobile's copy went stale
  #     twice; the second time a STORY item crashed the item screen, because an
  #     exhaustive switch can catch a missing case but not a missing union
  #     member.
  contracts:
    name: Contracts in sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check generated catalogs match voice/clio-phrases.json
        run: node voice/generate-voice-lines.mjs --check

      - name: Check client unions match the ModuleItemKind enum
        run: node scripts/check-module-item-kinds.mjs

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint

      - name: Run tests
        run: pnpm run test

      - name: Build client
        run: pnpm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000

  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eudora_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: services/api-service

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/eudora_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: services/api-service/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm run prisma:generate

      # `migrate deploy`, not `db push`. db push builds the database straight
      # from schema.prisma and never executes a migration, so the migration
      # chain — the thing production actually runs — was never tested here at
      # all. It had in fact drifted from the schema, undetected, until this
      # step was changed.
      - name: Apply migrations
        run: npx prisma migrate deploy

      # And having run them, assert they produce exactly what schema.prisma
      # describes. Without this, a migration that is merely *valid SQL* passes
      # while still leaving the database a different shape from the one every
      # query is typed against. Exit code 2 means "not empty" — i.e. drift.
      - name: Check migrations match the schema
        run: |
          npx prisma migrate diff \
            --from-config-datasource \
            --to-schema ./prisma/schema.prisma \
            --exit-code \
          && echo "Schema matches the migration chain."

      - name: Run seed database
        run: npx prisma db seed

      - name: Run lint
        run: pnpm run lint

      - name: Build service
        run: pnpm run build

      - name: Run unit tests
        run: pnpm run test

      - name: Run E2E tests
        run: pnpm run test:e2e --runInBand
        env:
          JWT_SECRET: super-secret-key-change-this-in-production-12345
          JWT_EXPIRATION: 1d
          STRIPE_SECRET_KEY: sk_test_REPLACE_WITH_YOUR_KEY
          STRIPE_PUBLISHABLE_KEY: pk_test_REPLACE_WITH_YOUR_KEY
          STRIPE_WEBHOOK_SECRET: whsec_REPLACE_WITH_YOUR_WEBHOOK_SECRET
          GOOGLE_CLIENT_ID: your-google-client-id-placeholder.apps.googleusercontent.com

  # Mobile had no job at all, so nothing stopped a change that broke the app
  # from landing. Typecheck is the whole of it: the project has no tests and
  # no lint script, and `tsc --noEmit` is the only automated statement anyone
  # can currently make about it. It catches the class of breakage that
  # actually happens here — the hand-written `src/core/contracts` drifting
  # from the API it describes.
  mobile:
    name: Mobile CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

  deploy:
    name: Deploy to GCP
    needs: [frontend, backend, mobile]
    # GCP deploy is paused while the app runs on Railway — flip on by setting
    # the GCP_DEPLOY_ENABLED repo variable to "true" once GCP billing/secrets are wired back up.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.GCP_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push API Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/api-service
          push: true
          tags: |
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/eudora-images/api-service:${{ github.sha }}
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/eudora-images/api-service:latest

      - name: Build and Push Client
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: |
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/eudora-images/client:${{ github.sha }}
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/eudora-images/client:latest

      - name: Deploy API Service to Cloud Run
        id: deploy-api
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: eudora-api
          region: ${{ vars.GCP_REGION }}
          image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/eudora-images/api-service:${{ github.sha }}
          secrets: |
            DATABASE_URL=DATABASE_URL:latest
            JWT_SECRET=JWT_SECRET:latest
          flags: |
            --port=3000
            --service-account=eudora-runtime-sa@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
            --add-cloudsql-instances=${{ vars.GCP_PROJECT_ID }}:${{ vars.GCP_REGION }}:eudora-db-instance

      - name: Deploy Client to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: eudora-client
          region: ${{ vars.GCP_REGION }}
          image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/eudora-images/client:${{ github.sha }}
          env_vars: |
            NEXT_PUBLIC_API_URL=${{ steps.deploy-api.outputs.url }}
          flags: |
            --port=3000
            --service-account=eudora-runtime-sa@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com

